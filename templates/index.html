<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Telegram Web Portal</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;background:#17212b;color:#fff;
 font-family:Arial, sans-serif;display:flex;align-items:center;
 justify-content:center;padding:20px
}
.container{width:100%;max-width:440px;text-align:center}
.logo{
 width:100px;height:100px;border-radius:50%;background:#229ed9;
 display:flex;align-items:center;justify-content:center;
 margin:0 auto 24px;font-size:54px
}
h1{font-size:29px;margin:0 0 12px}
.description{color:#a9b8c6;line-height:1.6;margin-bottom:30px}
.button{
 display:block;width:100%;padding:16px;border-radius:12px;
 background:#229ed9;color:white;text-decoration:none;
 font-weight:bold;margin-top:12px
}
.button.secondary{background:#263746}
.footer{margin-top:30px;color:#728394;font-size:12px}
</style>
</head>
<body>
<main class="container">
 <div class="logo">➤</div>
 <h1>Telegram Web</h1>
 <p class="description">
  Добро пожаловать в Telegram Web Portal.
  Открывайте официальный Telegram и управляйте
  собственным ботом через безопасный личный кабинет.
 </p>
 <a class="button" href="https://web.telegram.org/" target="_blank" rel="noopener">
  Открыть Telegram Web
 </a>
 <a class="button secondary" href="https://t.me/BotFather" target="_blank" rel="noopener">
  Открыть BotFather
 </a>
 <div class="footer">
  Безопасный доступ через официальные сервисы Telegram.
 </div>
</main>
</body>
</html>
